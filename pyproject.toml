[project]
name = "quant-agentic"
version = "0.1.0"
description = "quant-agentic: one-line project description."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "zhaodehua", email = "zhaodehua@taocheche.com" }
]
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pydantic-ai-slim[openai]>=2.70,<3",
    "pydantic-settings>=2.16.3",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0,<2.1",
    "timesfm[torch]>=3.0.2,<4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
